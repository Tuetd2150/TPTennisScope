services:
  postgres:
    image: postgres:16-alpine
    container_name: tennisscope-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tennisscope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - tennisscope-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tennisscope"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tennisscope-pgdata:
